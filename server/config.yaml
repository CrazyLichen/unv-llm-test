server:
  port: 8080
  mode: debug        # debug / release

database:
  driver: sqlite
  dsn: "./data/llm-test.db"

log:
  level: info
  format: json
  file: "./data/app.log"

upload:
  dir: "./data/uploads"
  max_image_size: 10485760       # 10MB
  max_image_count: 20
  max_image_batch_size: 52428800 # 50MB
